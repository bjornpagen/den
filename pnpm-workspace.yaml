packages:
  - "packages/*"
  # grizzle, the submodule pinned on its main branch: its own packages, versions and gates, none of den's.
  - "vendor/grizzle/packages/engine"
  - "vendor/grizzle/packages/grizzle"
  # The toolchain, the submodule pinned at its commit: its dev tools and testing library run from source, with gates of
  # their own, none of den's.
  - "vendor/toolchain/packages/devtools"
  - "vendor/toolchain/packages/testing"
# Approved dependencies' agent skills link into the one skills folder, which .claude/skills and .cursor/skills link to.
skills:
  dirs:
    - .agents/skills
catalogMode: strict
# lefthook's install script writes the git hooks.
allowBuilds:
  lefthook: true
# Admit a release once it is a day old, except Effect's own packages: den builds on Effect's newest release.
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - effect
  - "@effect/*"
# Node 26 is the floor, so its types are the only Node types, even for packages that ask for newer: code typed against
# 26 runs on 26 and every Node after it.
overrides:
  "@types/node": "catalog:"
catalog:
  "@babel/core": 7.29.7
  "@effect/platform-node": 4.1.3
  "@effect/tsgo": 0.67.7
  "@effect/vitest": 4.1.3
  "@tailwindcss/node": 4.3.4
  "@types/babel__core": 7.20.5
  "@types/node": 26.6.6
  "@types/pg": 8.23.1
  "@vercel/queue": 0.11.0
  arkregex: 0.0.14
  babel-plugin-react-compiler: 1.0.0
  effect: 4.1.4
  fallow: 3.38.1
  lefthook: 2.2.2
  oxfmt: 0.76.0
  oxlint-tsgolint: 7.0.2005
  oxlint: 1.91.0
  pg: 8.23.1
  turbo: 2.11.10
  typescript: 7.1.0-beta
  vite: 8.3.5
  vitest: 5.1.0
permissions:
  fallow:
    skills: true
