# The hooks run only the pinned lefthook: without this, the generated script searches a dozen
# places for a lefthook binary and lets the commit through when it finds none.
lefthook: pnpm exec lefthook
# The hooks never format or stage files, they only refuse. A commit checks the format of the files it stages and
# every project's types, incrementally (pnpm types); a push runs the whole gate (pnpm check), with type-aware lint and a
# typecheck from scratch. A merge or rebase skips pre-commit, so the push checks again what it carries.
pre-commit:
  parallel: true
  skip:
    - merge
    - rebase
  jobs:
    - name: format
      run: pnpm exec oxfmt --check --no-error-on-unmatched-pattern {staged_files}
    - name: types
      run: pnpm types
pre-push:
  jobs:
    - name: check
      run: pnpm check
